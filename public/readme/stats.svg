  <text x="724" y="316" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#e8eefc" class="fade" style="animation-delay:2.06s">9%</text>
</g>
<g>
  <text x="40" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cfd8ec" class="fade" style="animation-delay:1.18s">Other</text>
  <rect x="150" y="328" width="560" height="14" rx="7" fill="#ffffff" fill-opacity=".06"/>
