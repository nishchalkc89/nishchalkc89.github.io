<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="GitHub stats of Nishchal KC: 49 repositories, 29 stars, 4 followers">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a35cff"/><stop offset=".55" stop-color="#4f8cff"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
  <radialGradient id="r1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a35cff" stop-opacity=".5"/><stop offset="1" stop-color="#a35cff" stop-opacity="0"/></radialGradient>
  <radialGradient id="r2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00e5ff" stop-opacity=".28"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  <clipPath id="rc"><rect width="900" height="360" rx="20"/></clipPath>
  <style>
    .pop{opacity:0;animation:pop .7s cubic-bezier(.22,1,.36,1) forwards}
    @keyframes pop{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    .bar{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.22,1,.36,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .fade{opacity:0;animation:fade .6s ease forwards}
    @keyframes fade{to{opacity:1}}
    .glow{animation:glow 3.4s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:.8}50%{opacity:1}}
    .sheen{transform-box:fill-box;animation:sheen 4.5s ease-in-out infinite}
    @keyframes sheen{0%,55%{transform:translateX(-120%)}100%{transform:translateX(460%)}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
  </style>
</defs>
<g clip-path="url(#rc)">
  <rect width="900" height="360" fill="#050a14"/>
  <rect width="900" height="360" fill="url(#grid)"/>
  <circle cx="800" cy="20" r="320" fill="url(#r1)"/>
  <circle cx="60" cy="360" r="280" fill="url(#r2)"/>
</g>
<rect width="900" height="360" rx="20" fill="none" stroke="#fff" stroke-opacity=".14"/>

<text x="40" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="url(#g)" class="fade">GitHub stats</text>
<text x="212" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#9aa7c4" class="fade" style="animation-delay:.2s">@nishchalkc89</text>
<g class="pop" style="animation-delay:0.15s">
  <rect x="40" y="78" width="190" height="92" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
  <rect x="40" y="78" width="190" height="3" rx="1.5" fill="url(#g)" class="glow"/>
  <text x="60" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="url(#g)" class="glow">49</text>
  <text x="60" y="156" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#a9b6d2">Repositories</text>
</g>
<g class="pop" style="animation-delay:0.27s">
