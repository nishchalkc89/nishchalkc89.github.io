  <text x="265" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="url(#g)" class="glow">29</text>
  <text x="265" y="156" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#a9b6d2">Stars earned</text>
</g>
<g class="pop" style="animation-delay:0.39s">
  <rect x="450" y="78" width="190" height="92" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
  <rect x="450" y="78" width="190" height="3" rx="1.5" fill="url(#g)" class="glow"/>
  <text x="470" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="url(#g)" class="glow">4</text>
  <text x="470" y="156" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#a9b6d2">Followers</text>
</g>
<g class="pop" style="animation-delay:0.51s">
  <rect x="655" y="78" width="190" height="92" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
  <rect x="655" y="78" width="190" height="3" rx="1.5" fill="url(#g)" class="glow"/>
  <text x="675" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="url(#g)" class="glow">3+</text>
  <text x="675" y="156" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#a9b6d2">Years on GitHub</text>
</g>
<text x="40" y="214" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#e8eefc" class="fade" style="animation-delay:.6s">Languages <tspan fill="#8190b0" font-weight="400" font-size="13">by number of repositories</tspan></text>
<g>
