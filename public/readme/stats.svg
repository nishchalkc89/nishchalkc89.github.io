</g>
<g>
  <text x="40" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cfd8ec" class="fade" style="animation-delay:0.94s">CSS</text>
  <rect x="150" y="280" width="560" height="14" rx="7" fill="#ffffff" fill-opacity=".06"/>
  <g clip-path="inset(0 round 7px)">
    <rect class="bar" x="150" y="280" width="73" height="14" rx="7" fill="url(#g)" style="animation-delay:0.94s"/>
