  </g>
  <text x="724" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#e8eefc" class="fade" style="animation-delay:2.1799999999999997s">7%</text>
</g>
<g transform="translate(830 300)">
  <circle class="ping" r="8" fill="#00e5ff"/><circle r="6" fill="#00e5ff"/>
  <text x="-6" y="30" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8190b0">updated Oct 2026</text>
